name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # Actions pineadas por SHA (reauditoría 31-07, P2.1): un tag flotante
      # puede moverse; el SHA no. checkout = v4.2.2, setup-python = v5.3.0.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spike/requirements-ci.txt
      - name: Instalar dependencias (sin torch)
        run: pip install -r spike/requirements-ci.txt
      - name: Lint (F y W completos — fatales, imports muertos, f-strings vacías)
        run: ruff check spike --select E9,F,W
      - name: Type check (módulos núcleo del instrumento)
        working-directory: spike
        run: python -m mypy --ignore-missing-imports --follow-imports=skip parsers.py artefactos.py manifiesto.py linter_contraste.py release_manifest.py incertidumbre.py generar_benchmark.py
      - name: Auditoría de dependencias CI (pip-audit)
        working-directory: spike
        run: python -m pip_audit -r requirements-ci.txt
      - name: Auditoría de dependencias runtime (pip-audit, pins directos)
        working-directory: spike
        # --no-deps: audita los pins DIRECTOS de requirements.txt sin
        # resolver transitivas (la cadena de sentence-transformers/torch,
        # ~2 GB, hace impracticable la resolución completa en CI).
        # Exclusión documentada en THIRD_PARTY_NOTICES.md.
        run: python -m pip_audit --no-deps -r requirements.txt
      - name: Tests offline de parsers y agregación
        working-directory: spike
        run: |
          python test_parsers.py
          python test_parsers_tipados.py
          python test_parsers_contrato.py
          python test_manifiesto.py
          python test_version_unica.py
          python test_alta.py
          python test_effort.py
      - name: Puertas de mutantes 1,2,8,11 (parsers/linter/replay) y trazabilidad
        working-directory: spike
        run: |
          python test_replay_privacidad.py
          python test_gfinal_linter.py
          python test_trazabilidad.py
      - name: Adjudicación y vigía (contratos offline + 0 pendientes)
        working-directory: spike
        run: |
          python test_adjudicacion.py
          python test_vigia.py
          python adjudicacion.py --check
      - name: Manifiesto con pools (conteo exacto en los 6 entrypoints)
        working-directory: spike
        run: python test_manifiesto_pool.py
      - name: Neutralización de sensibles (canarios en toda la estructura)
        working-directory: spike
        run: python test_sensibles.py
      - name: Barrido con modelo falso (nada ilegible se vuelve conducta)
        working-directory: spike
        run: python test_barrido_falso.py
      - name: Linter de contraste (incluye validación retro-G2)
        working-directory: spike
        run: python test_linter_contraste.py
      - name: Reproceso de crudos contra baseline (regresión)
        working-directory: spike
        run: python reprocesar.py --check
      - name: Puerta de publicación (erratas + raws confirmatorios)
        working-directory: spike
        run: python reprocesar.py --check-publication
      - name: Release manifest (datasets del preprint intactos)
        working-directory: spike
        run: python release_manifest.py --verificar
      - name: Regeneración de cifras publicables desde el manifest (G9)
        working-directory: spike
        run: python regenerar_publicacion.py --check
      - name: PsicoBench al día con las matrices (tabla, panel y datos)
        working-directory: spike
        run: python generar_benchmark.py --check
      - name: Sitio divulgativo al día con sus fuentes (web/datos.js)
        run: python web/generar_datos.py --check
      - name: Paquete de publicación al día con sus fuentes (lista blanca)
        run: |
          python web/publicar.py
          python web/publicar.py --check
      - name: Contrato del marcado de la web (escapado real, no solo su forma)
        # node viene de serie en la imagen del runner: no hace falta una
        # action nueva que pinear.
        run: node web/marcado.prueba.cjs
      - name: Citas verificadas y CPR del manuscrito (sin red, caché firmada)
        working-directory: spike
        run: |
          python verificar_citas.py --check
          python verificar_afirmaciones.py --check
      - name: Sensibilidad determinista entre procesos (PYTHONHASHSEED)
        working-directory: spike
        run: python test_robustez_determinista.py
      - name: XSS estático (incluida la ampliación de sinks — debe ejecutarse)
        working-directory: spike
        run: |
          python test_xss_estatico.py | tee xss.log
          grep -q "ampliación de sinks: OK" xss.log
      - name: Schemas (replays, escenarios, export del panel e integrado)
        working-directory: spike
        run: python test_schemas.py
      - name: Smoke del pipeline en dry-run (sin red, sin claves)
        working-directory: spike
        run: python run_spike.py --dry-run --steps 2
      - name: Cobertura del instrumento (informativa)
        working-directory: spike
        run: |
          coverage erase
          for t in test_parsers.py test_parsers_tipados.py test_manifiesto.py test_linter_contraste.py; do coverage run -a "$t" > /dev/null; done
          coverage report -i --include="parsers.py,artefactos.py,manifiesto.py,linter_contraste.py"
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (binario pineado por versión y sha256)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          echo "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Gitleaks sobre TODO el historial (y prueba de alcance)
        # Reauditoría 31-07: la action escaneaba UN commit pese a
        # fetch-depth 0 (falso verde). Paso propio con --log-opts=--all y
        # verificación explícita de que el log declara >1 commit escaneado.
        run: |
          ./gitleaks detect --source . --log-opts=--all --redact 2>&1 | tee gitleaks.log
          grep -E "commits scanned" gitleaks.log
          n=$(grep -oE '[0-9]+ commits' gitleaks.log | grep -oE '[0-9]+' | head -1)
          echo "commits escaneados: $n"
          test "$n" -gt 1
